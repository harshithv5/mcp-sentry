[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-sentry"
version = "0.1.0"
description = "Security scanner for Model Context Protocol servers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "harshith" }]

dependencies = [
    "mcp>=1.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.scripts]
mcpscan-api = "mcpscan.api:_serve"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpscan"]
